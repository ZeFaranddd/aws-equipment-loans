# Rencana dua service (Track B). Week 12: image `api` dibuild dan dijalankan;
# service `db` direncanakan dan dipakai pada tahap berikutnya.
services:
  api:
    build: ./src
    image: equipment-api:latest
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ganti-di-env-lokal
      MYSQL_DATABASE: equipmentdb
    # port 3306 sengaja tidak dipublikasikan (hanya jaringan Docker internal)
